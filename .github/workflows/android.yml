name: Verify and build Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-public.mjs
      - run: TEST_BUILT=1 npm test -- --workers=2
  android:
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      FIELDNOTES_VERSION_CODE: ${{ github.run_number }}
      FIELDNOTES_VERSION_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Restore stable signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fieldnotes-release.jks"
          chmod 600 "$RUNNER_TEMP/fieldnotes-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fieldnotes-release.jks" >> "$GITHUB_ENV"
      - name: Build release and persistence test APKs
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
          # Release the build heap before starting the emulator on the same runner.
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native save, restart and in-place release update
        timeout-minutes: 18
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: scripts/android-progress-test.sh
      - name: Diagnose native runner failure
        if: failure()
        run: |
          free -m
          sudo dmesg --ctime | tail -80
      - name: Prepare signed APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ArchitectureFieldnotes.apk
          (cd artifacts && sha256sum ArchitectureFieldnotes.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ArchitectureFieldnotes-Android
          path: artifacts/
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/ArchitectureFieldnotes.apk artifacts/SHA256SUMS --verify-tag --title "Architecture Fieldnotes $RELEASE_TAG" --notes-file docs/release-notes.md
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fieldnotes-release.jks"
